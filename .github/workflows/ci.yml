name: 2D CI
on:
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
defaults:
  run:
    working-directory: Astrocore-Build
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Astrocore-Build
      - uses: actions/checkout@v4
        with:
          repository: Astrocore-Studio/Astrocore-Engine
          ref: 36453b0e297f7ca1d1a3536a077eefcef232a9b1
          path: Astrocore-Engine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Astrocore-Build
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features client -- -D warnings
      - run: cargo test --locked --workspace --features client
