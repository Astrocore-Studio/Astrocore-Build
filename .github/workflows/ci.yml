name: 2D CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
defaults:
  run:
    working-directory: Astrocore-Build
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Astrocore-Build
      - id: engine
        run: echo "rev=$(tr -d '[:space:]' < engine.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Astrocore-Studio/Astrocore-Engine
          ref: ${{ steps.engine.outputs.rev }}
          path: Astrocore-Engine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Astrocore-Build
      - run: python3 scripts/check_rsi_licenses.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features client,prototype-import -- -D warnings
      - run: cargo test --locked --workspace --features client,prototype-import
