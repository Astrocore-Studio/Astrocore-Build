[package]
name = "client"
description = "Клиент Astrocore Build: клавиши и окно рук и инвентаря поверх клиента движка"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
astrocore-client = { git = "https://github.com/Astrocore-Studio/Astrocore-Engine", branch = "main", package = "astrocore-client" }
astrocore-core.workspace = true
astrocore-render = { git = "https://github.com/Astrocore-Studio/Astrocore-Engine", branch = "main" }
astrocore-math.workspace = true
astrocore-world.workspace = true
bevy = { version = "=0.20.1", default-features = false, features = ["3d_bevy_render", "default_app", "bevy_winit", "bevy_window", "x11", "png", "std", "multi_threaded"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
gameplay.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[lints]
workspace = true
